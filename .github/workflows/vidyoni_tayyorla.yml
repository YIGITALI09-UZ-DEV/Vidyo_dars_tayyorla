name: Video Generation Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  prepare-and-generate-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libxrender-dev
      
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy pillow imageio imageio-ffmpeg numpy
      
      - name: Verify Input Files
        run: |
          echo "=== Input Files Check ==="
          ls -la timeline/ || echo "timeline/ not found"
          ls -la classroom/ || echo "classroom/ not found"
          ls -la Rasim/ || echo "Rasim/ not found"
      
      - name: Run Audio Processing (audyo_dars.py)
        run: python audyo_dars.py
        continue-on-error: true
      
      - name: Run Video Generation (video_yarat.py)
        run: python video_yarat.py
        continue-on-error: true
      
      - name: Check Output Directory
        run: |
          echo "=== Checking Output ==="
          if [ -d "output" ]; then
            echo "Output found:"
            ls -lah output/
          else
            echo "Output directory not created"
            pwd
            ls -la
          fi
      
      - name: Upload Generated Videos
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
          if-no-files-found: warn
          retention-days: 30
      
      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            timeline/
            temp/
          if-no-files-found: warn
          retention-days: 7
